# https://taskfile.dev
version: "3"

vars:
  COMPOSE_FILE: docker/docker-compose.yml
  SERVICE: dev

tasks:
  docker:build:
    desc: Build the Docker image then compile the catkin workspace
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} build {{.SERVICE}}
      - docker compose -f {{.COMPOSE_FILE}} run --rm {{.SERVICE}}
        bash -c "source /opt/ros/noetic/setup.bash && cd /workspace && catkin_make"

  docker:run:
    desc: Start the container and open an interactive shell
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} run --rm {{.SERVICE}} bash

  docker:up:
    desc: Start the development container in the background
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up -d {{.SERVICE}}

  docker:shell:
    desc: Open a shell in a running container
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec {{.SERVICE}} bash

  docker:down:
    desc: Stop the development container
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} down

  clean:
    desc: Remove catkin build and devel artifacts (forces full rebuild)
    cmds:
      - rm -rf build/ devel/