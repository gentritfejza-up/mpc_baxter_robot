services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: mpc_baxter_robot:dev
    container_name: mpc_baxter_robot_dev
    network_mode: host
    stdin_open: true
    tty: true
    ipc: host
    privileged: false
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ..:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/home/robot/.Xauthority:ro
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    cap_add:
      - SYS_PTRACE
    ulimits:
      memlock: -1
      stack: -1