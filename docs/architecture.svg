<text x="454" y="104" font-size="13" fill="#059669" text-anchor="middle" font-weight="bold">Planning (MPC, 50 Hz)</text>
<text x="826" y="104" font-size="13" fill="#D97706" text-anchor="middle" font-weight="bold">Execution (torque loop, 800 Hz)</text>
<text x="1132" y="104" font-size="13" fill="#7C3AED" text-anchor="middle" font-weight="bold">Plant</text>
