<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Control architecture of the Baxter MPC stack">
<title>Control architecture of the Baxter MPC stack</title>
<g font-family="Noto Sans, Liberation Sans, DejaVu Sans, Arial, sans-serif">
<rect x="0" y="0" width="1200" height="640" fill="#FFFFFF"/>
<text x="600" y="46" font-size="22" fill="#1F2937" text-anchor="middle" font-weight="bold">Control architecture of the Baxter MPC stack</text>
<text x="600" y="70" font-size="13" fill="#4B5563" text-anchor="middle">Per arm: a 50 Hz model predictive planner with a collision guard and an 800 Hz computed-torque loop; the robot returns its joint states at 1 kHz</text>
