<text x="32" y="162" font-size="15" fill="#1F2937" text-anchor="start" font-weight="bold">Reference source</text>
<text x="32" y="183" font-size="12" fill="#4B5563" text-anchor="start">pick_and_place_demo.py</text>
<text x="32" y="198" font-size="12" fill="#4B5563" text-anchor="start">belt model, grasp and</text>
<text x="32" y="213" font-size="12" fill="#4B5563" text-anchor="start">drop state machine</text>
<text x="32" y="228" font-size="12" fill="#4B5563" text-anchor="start">or rqt_reconfigure</text>
<text x="32" y="258" font-size="12" fill="#4B5563" text-anchor="start">joint set point q_ref</text>
<rect x="115.297" y="386" width="60.7031" height="18" rx="9" fill="#E0E9FC"/>
<text x="145.648" y="398.5" font-size="11" fill="#2454BE" text-anchor="middle" font-weight="bold">&lt;= 10 Hz</text>
<rect x="330" y="132" width="248" height="104" rx="6" fill="#EBF7F3" stroke="#059669" stroke-width="1.5"/>
<text x="346" y="162" font-size="15" fill="#1F2937" text-anchor="start" font-weight="bold">mpc_controller_node_left</text>
<text x="346" y="183" font-size="12" fill="#4B5563" text-anchor="start">OSQP QP, 25 steps / 1.5 s horizon</text>
<text x="346" y="198" font-size="12" fill="#4B5563" text-anchor="start">guard: floor, body, boxes, other arm</text>
<text x="346" y="213" font-size="12" fill="#4B5563" text-anchor="start">a_0 + base state (q0, v0)</text>
<rect x="516.75" y="202" width="45.25" height="18" rx="9" fill="#DCF0EA"/>
<text x="539.375" y="214.5" font-size="11" fill="#0C7B5C" text-anchor="middle" font-weight="bold">50 Hz</text>
<rect x="330" y="316" width="248" height="104" rx="6" fill="#EBF7F3" stroke="#059669" stroke-width="1.5"/>
<text x="346" y="346" font-size="15" fill="#1F2937" text-anchor="start" font-weight="bold">mpc_controller_node_right</text>
<text x="346" y="367" font-size="12" fill="#4B5563" text-anchor="start">OSQP QP, 25 steps / 1.5 s horizon</text>
<text x="346" y="382" font-size="12" fill="#4B5563" text-anchor="start">guard: floor, body, boxes, other arm</text>
<text x="346" y="397" font-size="12" fill="#4B5563" text-anchor="start">a_0 + base state (q0, v0)</text>
<rect x="516.75" y="386" width="45.25" height="18" rx="9" fill="#DCF0EA"/>
<text x="539.375" y="398.5" font-size="11" fill="#0C7B5C" text-anchor="middle" font-weight="bold">50 Hz</text>
<rect x="722" y="132" width="208" height="104" rx="6" fill="#FCF4EB" stroke="#D97706" stroke-width="1.5"/>
<text x="738" y="162" font-size="15" fill="#1F2937" text-anchor="start" font-weight="bold">Torque loop (left)</text>
<text x="738" y="183" font-size="12" fill="#4B5563" text-anchor="start">tau = M qdd + C + g, idle hold</text>
<text x="738" y="198" font-size="12" fill="#4B5563" text-anchor="start">KDL or Lagrange-Euler model</text>
<text x="738" y="213" font-size="12" fill="#4B5563" text-anchor="start">optional inner PD</text>
<rect x="862.453" y="202" width="51.5469" height="18" rx="9" fill="#FAECDC"/>
<text x="888.227" y="214.5" font-size="11" fill="#AA6412" text-anchor="middle" font-weight="bold">800 Hz</text>
<rect x="722" y="316" width="208" height="104" rx="6" fill="#FCF4EB" stroke="#D97706" stroke-width="1.5"/>
<text x="738" y="346" font-size="15" fill="#1F2937" text-anchor="start" font-weight="bold">Torque loop (right)</text>
<text x="738" y="367" font-size="12" fill="#4B5563" text-anchor="start">tau = M qdd + C + g, idle hold</text>
<text x="738" y="382" font-size="12" fill="#4B5563" text-anchor="start">KDL or Lagrange-Euler model</text>
<text x="738" y="397" font-size="12" fill="#4B5563" text-anchor="start">optional inner PD</text>
<rect x="862.453" y="386" width="51.5469" height="18" rx="9" fill="#FAECDC"/>
<text x="888.227" y="398.5" font-size="11" fill="#AA6412" text-anchor="middle" font-weight="bold">800 Hz</text>
<rect x="1080" y="132" width="104" height="288" rx="6" fill="#F5EFFE" stroke="#7C3AED" stroke-width="1.5"/>
<text x="1096" y="162" font-size="15" fill="#1F2937" text-anchor="start" font-weight="bold">Baxter</text>
<text x="1096" y="183" font-size="12" fill="#4B5563" text-anchor="start">Gazebo or</text>
<text x="1096" y="198" font-size="12" fill="#4B5563" text-anchor="start">real robot</text>
<text x="1096" y="228" font-size="12" fill="#4B5563" text-anchor="start">publishes</text>
<text x="1096" y="243" font-size="12" fill="#4B5563" text-anchor="start">joint states</text>
<text x="1096" y="258" font-size="12" fill="#4B5563" text-anchor="start">q, qd</text>
<rect x="1122.23" y="386" width="45.7656" height="18" rx="9" fill="#EDE3FC"/>
<text x="1145.12" y="398.5" font-size="11" fill="#6536C0" text-anchor="middle" font-weight="bold">1 kHz</text>
<text x="258" y="147" font-size="11" fill="#4B5563" text-anchor="middle">ref_0..6</text>
<text x="258" y="161" font-size="11" fill="#4B5563" text-anchor="middle">dynamic_reconfigure</text>
<text x="258" y="175" font-size="11" fill="#4B5563" text-anchor="middle">&lt;= 10 Hz</text>
<text x="650" y="147" font-size="11" fill="#4B5563" text-anchor="middle">/robot/limb/left/</text>
<text x="650" y="161" font-size="11" fill="#4B5563" text-anchor="middle">acceleration_command</text>
<text x="650" y="175" font-size="11" fill="#4B5563" text-anchor="middle">50 Hz</text>
<text x="1008" y="147" font-size="11" fill="#4B5563" text-anchor="middle">/robot/limb/left/</text>
<text x="1008" y="161" font-size="11" fill="#4B5563" text-anchor="middle">joint_command</text>
<text x="1008" y="175" font-size="11" fill="#4B5563" text-anchor="middle">TORQUE_MODE, 800 Hz</text>
<text x="258" y="331" font-size="11" fill="#4B5563" text-anchor="middle">ref_0..6</text>
<text x="258" y="345" font-size="11" fill="#4B5563" text-anchor="middle">dynamic_reconfigure</text>
<text x="258" y="359" font-size="11" fill="#4B5563" text-anchor="middle">&lt;= 10 Hz</text>
<text x="650" y="331" font-size="11" fill="#4B5563" text-anchor="middle">/robot/limb/right/</text>
<text x="650" y="345" font-size="11" fill="#4B5563" text-anchor="middle">acceleration_command</text>
<text x="650" y="359" font-size="11" fill="#4B5563" text-anchor="middle">50 Hz</text>
<text x="1008" y="331" font-size="11" fill="#4B5563" text-anchor="middle">/robot/limb/right/</text>
<text x="1008" y="345" font-size="11" fill="#4B5563" text-anchor="middle">joint_command</text>
<text x="1008" y="359" font-size="11" fill="#4B5563" text-anchor="middle">TORQUE_MODE, 800 Hz</text>
<text x="682" y="267" font-size="11" fill="#4B5563" text-anchor="middle">/robot/joint_states (1 kHz)</text>
<text x="380" y="274" font-size="11" fill="#4B5563" text-anchor="start">other arm&#x27;s joint states</text>
<text x="380" y="288" font-size="11" fill="#4B5563" text-anchor="start">(for the guard)</text>
<text x="352.891" y="564" font-size="11" fill="#4B5563" text-anchor="start">One control cycle:</text>
<text x="452.906" y="564" font-size="11" fill="#4B5563" text-anchor="start">reference</text>
<text x="528.234" y="564" font-size="11" fill="#4B5563" text-anchor="start">MPC plan</text>
<text x="603.266" y="564" font-size="11" fill="#4B5563" text-anchor="start">torque command</text>
<text x="719.078" y="564" font-size="11" fill="#4B5563" text-anchor="start">plant</text>
<text x="771.625" y="564" font-size="11" fill="#4B5563" text-anchor="start">state feedback</text>
