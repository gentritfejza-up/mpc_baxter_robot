from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator, double_t

# Initialize the generator
gen = ParameterGenerator()

# Number of joints
num_joints = 7

# Default values
default_position_weights = [20.0, 30.0, 20.0, 20.0, 20.0, 20.0, 30.0]
default_acceleration_weights = [0.05, 0.05, 0.01, 0.01, 0.005, 0.005, 0.005]

# Joint name -> [lower_limit, upper_limit]
# s0, s1, e0, e1, w0, w1, w2
joint_limits = [
    [-1.701679,  1.701679],  # s0
    [-2.146754,  1.0472  ],  # s1
    [-3.054326,  3.054326],  # e0
    [-0.049868,  2.617994],  # e1
    [-3.059   ,  3.059   ],  # w0
    [-1.5708 ,  2.0944  ],  # w1
    [-3.059   ,  3.059   ]   # w2
]

# We can choose default references as 0.0 for each joint
default_refs = [0.0] * num_joints

# Add parameters for position weights
for i in range(num_joints):
    gen.add(
        f"pos_weight_{i}",
        double_t,
        0,
        f"Position weight for joint {i}",
        default_position_weights[i],
        0.0,
        100.0,
    )

# Add parameters for acceleration weights
for i in range(num_joints):
    gen.add(
        f"accel_weight_{i}",
        double_t,
        0,
        f"Acceleration weight for joint {i}",
        default_acceleration_weights[i],
        0.0,
        0.1,
    )

# Add one parameter per joint reference, with the corresponding min/max from joint_limits
for i in range(num_joints):
    joint_min = joint_limits[i][0]
    joint_max = joint_limits[i][1]
    gen.add(
        f"ref_{i}",            # param name e.g., ref_0, ref_1, ...
        double_t,
        0,                     # level=0 (no special usage)
        f"Reference for joint {i}",
        default_refs[i],       # default
        joint_min,             # min limit for that joint
        joint_max              # max limit for that joint
    )

# Generate the dynamic reconfigure options
gen.generate("mpc_controller", "mpc_node", "MpcParameters")